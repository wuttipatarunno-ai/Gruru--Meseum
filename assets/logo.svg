<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <linearGradient id="timeWarp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#8C6BFF"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7FF3A"/>
      <stop offset="100%" stop-color="#2EE6FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Specimen Bracket & Icon Group -->
  <g transform="translate(10, 10)">
    <!-- HUD Outer Bracket (45 deg cut corners) -->
    <path d="M 12 0 L 88 0 L 100 12 L 100 88 L 88 100 L 12 100 L 0 88 L 0 12 Z" 
          stroke="#2C2C3A" stroke-width="1.5" fill="#17171F" fill-opacity="0.8"/>
    
    <!-- Accent HUD Corner markers -->
    <path d="M 0 20 L 0 12 L 12 0 L 24 0" stroke="#D7FF3A" stroke-width="2.5" fill="none"/>
    <path d="M 100 80 L 100 88 L 88 100 L 76 100" stroke="#2EE6FF" stroke-width="2.5" fill="none"/>
    
    <!-- Inner Crosshairs & Grid Lines -->
    <line x1="50" y1="12" x2="50" y2="24" stroke="#8A8A9E" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="50" y1="76" x2="50" y2="88" stroke="#8A8A9E" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="12" y1="50" x2="24" y2="50" stroke="#8A8A9E" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="76" y1="50" x2="88" y2="50" stroke="#8A8A9E" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Concentric Time Rings -->
    <circle cx="50" cy="50" r="34" stroke="#2C2C3A" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="50" cy="50" r="26" stroke="#8C6BFF" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Knowledge Graph Core: Excavated Rune G/Node Cluster -->
    <!-- Connection Lines -->
    <line x1="50" y1="28" x2="68" y2="42" stroke="#2EE6FF" stroke-width="1.8"/>
    <line x1="68" y1="42" x2="62" y2="68" stroke="#8C6BFF" stroke-width="1.8"/>
    <line x1="62" y1="68" x2="36" y2="68" stroke="#D7FF3A" stroke-width="1.8"/>
    <line x1="36" y1="68" x2="32" y2="42" stroke="#FF5A1F" stroke-width="1.8"/>
    <line x1="32" y1="42" x2="50" y2="28" stroke="#D7FF3A" stroke-width="1.8"/>
    <line x1="50" y1="50" x2="68" y2="42" stroke="#2EE6FF" stroke-width="1.2"/>
    <line x1="50" y1="50" x2="36" y2="68" stroke="#D7FF3A" stroke-width="1.2"/>

    <!-- Center Hub: Quantum Brain / Core Node -->
    <circle cx="50" cy="50" r="7" fill="#0B0B0F" stroke="#D7FF3A" stroke-width="2.5" filter="url(#neonGlow)"/>
    <circle cx="50" cy="50" r="3" fill="#D7FF3A"/>

    <!-- Satellite Nodes with Category Shapes -->
    <!-- Science (Cyan Circle) -->
    <circle cx="50" cy="28" r="4.5" fill="#2EE6FF"/>
    <!-- Art/Design (Coral Ring) -->
    <circle cx="68" cy="42" r="4" fill="#0B0B0F" stroke="#FF5FA2" stroke-width="1.5"/>
    <!-- Technology (Violet Square) -->
    <rect x="58.5" y="64.5" width="7" height="7" fill="#8C6BFF"/>
    <!-- History (Ember Hexagon) -->
    <polygon points="36,64 40,68 36,72 32,72 28,68 32,64" fill="#FF5A1F"/>
    <!-- Nature (Bio Green Diamond) -->
    <polygon points="32,38 36,42 32,46 28,42" fill="#34E89E"/>
    
    <!-- Mini Specimen Code -->
    <text x="50" y="94" font-family="'Courier New', monospace" font-size="6" fill="#8A8A9E" text-anchor="middle" letter-spacing="1">EXP.01//GRM</text>
  </g>

  <!-- Brand Typography -->
  <!-- Main Brand Title -->
  <text x="128" y="52" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-weight="700" font-size="34" fill="#F2EDE3" letter-spacing="3">
    GRURU <tspan fill="#D7FF3A">MUSEUM</tspan>
  </text>

  <!-- Tagline / Division -->
  <text x="130" y="74" font-family="'Courier New', monospace" font-weight="600" font-size="10.5" fill="#2EE6FF" letter-spacing="3.5">
    FUTURE ARCHAEOLOGY • DIGITAL KNOWLEDGE LAB
  </text>

  <!-- Motto Subline -->
  <text x="130" y="92" font-family="'IBM Plex Sans Thai', sans-serif" font-weight="400" font-size="11" fill="#8A8A9E" letter-spacing="0.5">
    “New Knowledge. New Storytelling. Built for Everyday Living.”
  </text>

  <!-- Tech status indicator pill -->
  <g transform="translate(415, 24)">
    <rect x="0" y="0" width="52" height="18" fill="#17171F" stroke="#2C2C3A" rx="2"/>
    <circle cx="8" cy="9" r="3" fill="#34E89E"/>
    <text x="16" y="12" font-family="'Courier New', monospace" font-size="8" fill="#8A8A9E" letter-spacing="1">LIVE</text>
  </g>
</svg>
